# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

continuation_prompt = "[▶](bright-green)"

[profiles]
claude-code = "$directory$git_branch$claude_model$claude_context$claude_cost"

[character]
success_symbol = "[❯❯❯](bold green)"
error_symbol = "[❯❯❯](bold red)"
vicmd_symbol = "[❮❮❮](bold green)"

[claude_context]
gauge_width = 10

[[claude_context.display]]
threshold = 0
style = "bold cyan"

[[claude_context.display]]
threshold = 30
style = "bold green"

[[claude_context.display]]
threshold = 60
style = "bold yellow"

[[claude_context.display]]
threshold = 80
style = "bold red"

[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold blue"

[git_branch]
symbol = "🌱 "

[git_metrics]
disabled = false

[git_status]
conflicted = "🏳"
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"

[kubernetes]
disabled = false

[status]
format = '[\[$symbol $common_meaning$signal_name$maybe_int\]]($style) '
disabled = false

[terraform]
format = "via [$symbol$version $workspace]($style) "
